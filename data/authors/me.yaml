bio: |
  Xingda Li is a Ph.D. candidate in the Department of Psychological and
  Cognitive Sciences at Tsinghua University, and is also affiliated with
  the Tsinghua Laboratory of Brain and Intelligence. His research interests
  lie at the intersection of educational psychology and cognitive
  neuroscience. He studies how learners build, use, and update knowledge,
  with an emphasis on linking behavioral learning processes to neural
  representations during naturalistic educational experiences.

